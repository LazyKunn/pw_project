<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/favicon.ico" type="image/svg+xml">
    
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/movies.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>VideoMania | Movies</title>
</head>
<body>
    <div class="stripes"></div>
    <header class="main-header">
        <div class="header-left">
            <a href="index.html" class="logo-text">
                <span class="v">V</span><span class="i">I</span><span class="d">D</span><span class="e">E</span><span class="o">O</span><span class="m">M</span><span class="a">A</span><span class="n">N</span><span class="i2">I</span><span class="a2">A</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">Início</a>
                <a href="movies.html">Filmes</a>
            </nav>
        </div>
        
        <div class="header-right">
            <nav class="nav-links">
                <a href="cart.html">
                    <i class="fa-solid fa-cart-shopping"></i>
                </a>
                <a href="login.html">Iniciar Sessão</a>
                <a href="register.html" class="btn">Criar Conta</a>
            </nav>
        </div>
    </header>
    
    <main>
        
        <section class="search-filter-section">
            <form class="search-bar" id="search-form">
                <input type="text" id="search-input" placeholder="Pesquisar filme...">
                <button type="submit" class="btn"><i class="fa-solid fa-magnifying-glass"></i></button>
            </form>
            
            <div class="filters">
                <select id="genre-filter">
                    <option value="">Todos os Géneros</option>
                    <option value="28">Ação</option>
                    <option value="878">Ficção Científica</option>
                    <option value="35">Comédia</option>
                </select>
                
                <select id="sort-filter">
                    <option value="popularity.desc">Mais Populares</option>
                    <option value="primary_release_date.desc">Mais Recentes</option>
                </select>
            </div>
        </section>

        <!-- Secção da Grelha de Filmes -->
        <section class="catalog-section">
            <div id="movies-grid" class="movies-grid"></div>
        </section>

    </main>

    <div class="stripes"></div>
    
    <footer class="main-footer">
        <p>&copy; 2026 VideoMania</p>
        <p>André Silva & Diogo Silva</p>
    </footer>

    <script src="scripts/movies.js"></script>

</body>
</html>
